apiVersion: v1
kind: Namespace
metadata:
  name: kong-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kong
  namespace: kong-operator
spec:
  interval: 5m
  url: https://charts.konghq.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong-operator
  namespace: kong-operator
spec:
  interval: 5m
  releaseName: eg
  chart:
    spec:
      chart: kong-operator
      version: '1.4.1'
      sourceRef:
        kind: HelmRepository
        name: kong
      interval: 5m
  values:
    deployment:
      kong: 
        enabled: true
      userDefinedVolumes:
        - name: "grpc-proto"
          configMap:
            name: "grpc-proto"
      userDefinedVolumeMounts:
        - name: "grpc-proto-volume"
          mountPath: "/etc/kong/proto/service.proto"
          subPath: "service.proto"

