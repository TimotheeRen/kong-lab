apiVersion: v1
kind: Namespace
metadata:
  name: telepresence
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: telepresence
  namespace: telepresence
spec:
  interval: 5m
  url: oci://ghcr.io/telepresenceio/telepresence-oss
  ref:
    semver: "2.32.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telepresence-operator
  namespace: telepresence
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: telepresence
