apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kafka
  namespace: kafka
spec:
  interval: 5m
  url: oci://quay.io/strimzi-helm/strimzi-kafka-operator
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: "1.3.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-operator
  namespace: kafka
spec:
  interval: 5m
  releaseName: eg
  chartRef:
    kind: OCIRepository
    name: kafka
