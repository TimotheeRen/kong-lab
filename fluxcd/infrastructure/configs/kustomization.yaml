apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway.yaml
  - gateway-class.yaml
  - gateway-configuration.yaml
  - gateway-plugin-grpc.yaml

configMapGenerator:
  - name: grpc-proto
    namespace: default
    options:
      disableNameSuffixHash: true
    files:
      - proto/service.proto
