syntax = "proto3";

package service;

import "google/api/annotations.proto";

service Service {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (google.api.http) = {
      get: "/grpc/info/{username}/{email}"
    };
  }
}

message GetInfoRequest {
  string username = 1;
  string email = 2;
}

message GetInfoResponse {
  string info = 1;
}
